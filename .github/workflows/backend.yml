name: Backend

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/PRESENCE-EVALUATION.md"
      - "docs/evidence/presence-evaluation.json"
      - "docs/PRESENCE-REPLAY.md"
      - "docs/evidence/presence-replay*.json"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/PRESENCE-EVALUATION.md"
      - "docs/evidence/presence-evaluation.json"
      - "docs/PRESENCE-REPLAY.md"
      - "docs/evidence/presence-replay*.json"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    name: Rust build & test
    runs-on: ubuntu-latest

    # Integration tests (#[sqlx::test]) create a throwaway database each.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: argowei
          POSTGRES_PASSWORD: argowei
          POSTGRES_DB: argowei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argowei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://argowei:argowei@localhost:5432/argowei

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Verify presence evaluation
        run: |
          cargo test --locked -p argowei-api --example presence_evaluation
          cargo run --locked -q -p argowei-api --example presence_evaluation | diff - docs/evidence/presence-evaluation.json

      - name: Verify presence trace replay
        run: |
          cargo test --locked -p argowei-api --example presence_replay
          cargo run --locked -q -p argowei-api --example presence_replay -- docs/evidence/presence-replay.synthetic.json | diff - docs/evidence/presence-replay.synthetic-report.json
