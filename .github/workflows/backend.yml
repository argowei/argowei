name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    name: Rust build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when backend is not present
        if: ${{ hashFiles('backend/Cargo.toml') == '' }}
        run: echo "backend/Cargo.toml not found; nothing to test."

      - name: Setup Rust
        if: ${{ hashFiles('backend/Cargo.toml') != '' }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          workspaces: backend

      - name: Build
        if: ${{ hashFiles('backend/Cargo.toml') != '' }}
        working-directory: backend
        run: cargo build --release --locked

      - name: Test
        if: ${{ hashFiles('backend/Cargo.toml') != '' }}
        working-directory: backend
        run: cargo test --release --locked
