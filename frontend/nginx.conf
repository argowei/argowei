# Angular fingerprints its bundles (main-236OE4DA.js), so those can be cached
# forever. Everything else, the app entry point above all, is revalidated so a
# new build is picked up on the next load. API responses are left untouched.
map $uri $argowei_cache_control {
    default                                 "no-cache";
    "~^/api(/|$)"                           "";
    "~-[A-Za-z0-9_-]{8}\.(?:js|css)$"       "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Declared once at server level: an add_header inside a location would
    # replace this whole set for that location.
    add_header Cache-Control $argowei_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Keep the browser on one origin. The API checks Origin against Host for
    # state-changing requests, so preserve the host and port seen by the user.
    location = /api {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $http_host;
    }

    location ^~ /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $http_host;
    }

    # A missing bundle (for example one referenced by a stale page after an
    # upgrade) must be a 404, not the app entry point served as JavaScript.
    location ~* \.(?:js|css|map|ico|png|svg|webp|woff2?|txt|json)$ {
        try_files $uri =404;
    }

    # A reload of an Angular route must return the app entry point.
    location / {
        try_files $uri /index.html;
    }
}
