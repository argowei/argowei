services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argowei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argowei}
      POSTGRES_DB: ${POSTGRES_DB:-argowei}
    ports:
      # Loopback only: the backend runs on the host network (see below) and
      # reaches the database via 127.0.0.1; nothing else on the LAN needs it.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argowei}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: crates/argowei-api/Dockerfile
    # Host networking is required for LAN discovery: on Docker's default
    # bridge network the container only sees its own virtual subnet, so ARP
    # scans, DNS serving and similar features would never reach the real LAN.
    # The API therefore listens on port 8000 of the host itself.
    network_mode: host
    # Least privilege: raw sockets for ARP/packet capture only. Add NET_ADMIN
    # later, when firewall enforcement (gateway mode) is used.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    # The image grants NET_RAW to the non-root binary as a file capability.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argowei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argowei}
      POSTGRES_DB: ${POSTGRES_DB:-argowei}
      # Host network: the loopback-published database port.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ARGOWEI_BIND_ADDRESS: ${ARGOWEI_BIND_ADDRESS:-0.0.0.0:8000}
      ARGOWEI_COOKIE_SECURE: ${ARGOWEI_COOKIE_SECURE:-false}
      ARGOWEI_SESSION_TTL_HOURS: ${ARGOWEI_SESSION_TTL_HOURS:-24}
      ARGOWEI_DISCOVERY_INTERFACES: ${ARGOWEI_DISCOVERY_INTERFACES:-}
      ARGOWEI_DISCOVERY_INTERVAL_SECS: ${ARGOWEI_DISCOVERY_INTERVAL_SECS:-300}
      ARGOWEI_DISCOVERY_TIMEOUT_SECS: ${ARGOWEI_DISCOVERY_TIMEOUT_SECS:-3}
      ARGOWEI_OFFLINE_AFTER_MISSED_SCANS: ${ARGOWEI_OFFLINE_AFTER_MISSED_SCANS:-3}
      ARGOWEI_OFFLINE_AFTER_SECS: ${ARGOWEI_OFFLINE_AFTER_SECS:-900}
      ARGOWEI_BASELINE_WINDOW_SECS: ${ARGOWEI_BASELINE_WINDOW_SECS:-0}
      ARGOWEI_HOSTNAME_SOURCES: ${ARGOWEI_HOSTNAME_SOURCES:-dhcp,mdns,netbios,rdns}
      ARGOWEI_DNS_SERVER: ${ARGOWEI_DNS_SERVER:-}
      ARGOWEI_DHCP_LEASES_FILE: ${ARGOWEI_DHCP_LEASES_FILE:-}
      ARGOWEI_HOSTNAME_TIMEOUT_MS: ${ARGOWEI_HOSTNAME_TIMEOUT_MS:-1000}
      ARGOWEI_HOSTNAME_REFRESH_SECS: ${ARGOWEI_HOSTNAME_REFRESH_SECS:-3600}
      ARGOWEI_HOSTNAME_CONCURRENCY: ${ARGOWEI_HOSTNAME_CONCURRENCY:-16}
      ARGOWEI_SCAN_CONCURRENCY: ${ARGOWEI_SCAN_CONCURRENCY:-2}
      ARGOWEI_SCAN_ALLOWED_RANGES: ${ARGOWEI_SCAN_ALLOWED_RANGES:-}
      ARGOWEI_SCAN_MAX_SECS: ${ARGOWEI_SCAN_MAX_SECS:-0}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    # The backend is on the host network, not on the compose network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4200:8080"
    # Static files and a reverse proxy need no privileges and no writable
    # image; Nginx keeps its pid file and temp files in /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend

volumes:
  postgres-data:
